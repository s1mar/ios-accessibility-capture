# .github/workflows/ios-surface.yml
name: ios-surface

on:
  workflow_dispatch:
    inputs:
      device:
        description: Simulator device name
        default: "iPhone 16"

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Check out Wikipedia iOS
        uses: actions/checkout@v4
        with:
          repository: wikimedia/wikipedia-ios
          path: wikipedia-ios

      - name: Select the newest Xcode
        run: |
          # The runner defaults to Xcode 16.4, but wikipedia-ios main uses iOS 26 "Liquid
          # Glass" APIs (glassEffect, .glassProminent, UIButton.Configuration.glass), which
          # 16.4 cannot compile. Pick the highest Xcode 26 present.
          NEWEST=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          echo "selecting $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Environment
        run: |
          xcodebuild -version
          echo "--- available Xcodes ---"
          ls /Applications | grep -i '^Xcode' || true
          xcrun simctl list runtimes

      - name: Generate the open-source build configuration
        working-directory: wikipedia-ios
        run: |
          # wikipedia-ios does not commit Configurations/OpenSourceDebug.xcconfig; it is
          # generated. Without this the build fails with "Unable to open base configuration
          # reference file". The "ci" argument writes the file with the default team id and
          # skips the interactive team-selection prompt.
          scripts/setup_bundle_id ci
          cat Configurations/OpenSourceDebug.xcconfig

      - name: List schemes
        working-directory: wikipedia-ios
        run: xcodebuild -list -project Wikipedia.xcodeproj

      - name: Boot simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true

      - name: Build for simulator
        working-directory: wikipedia-ios
        run: |
          # Ad-hoc sign (CODE_SIGN_IDENTITY="-") rather than disabling signing. With
          # CODE_SIGNING_ALLOWED=NO the App Group entitlement is stripped, so at runtime
          # containerURL(forSecurityApplicationGroupIdentifier:) returns nil and MWKDataStore
          # crashes in setupLegacyDataStore -> NSURL fileURLWithPath: with a nil path. The app
          # then dies instantly while simctl launch still reports success.
          # Capture the FULL log to a file and surface only compiler diagnostics.
          # An earlier run piped to `tail`, which discarded the one line that mattered.
          set +e
          xcodebuild -project Wikipedia.xcodeproj -scheme Wikipedia -configuration Debug             -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath ../dd             CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="-"             build > ../build.log 2>&1
          RC=$?
          echo "xcodebuild exit=$RC"
          echo "============ compiler diagnostics ============"
          grep -E "(error|warning): " ../build.log | sort -u | head -60 || true
          echo "============ last 40 lines ==================="
          tail -40 ../build.log
          exit $RC

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Install and launch
        run: |
          APP=$(find dd/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "app bundle: $APP"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "bundle id: $BID"
          echo "BID=$BID" >> "$GITHUB_ENV"
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID"
          sleep 15

      - name: Python 3.10 for idb
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install idb
        env:
          # Homebrew now refuses formulae from third-party taps unless the tap is allow-listed:
          # "Refusing to load formula facebook/fb/idb-companion from untrusted tap facebook/fb".
          HOMEBREW_ALLOWED_TAPS: facebook/fb
        run: |
          brew tap facebook/fb
          brew install facebook/fb/idb-companion
          # fb-idb calls asyncio.get_event_loop(), which stopped implicitly creating a loop
          # in Python 3.12. On the runner's default Python it dies with
          # "There is no current event loop in thread 'MainThread'", so install it under 3.10.
          python -m pip install --upgrade pip
          python -m pip install fb-idb
          idb --help > /dev/null && echo "idb available"
          python -c "import sys; print('idb python', sys.version)"

      - name: Capture accessibility trees
        run: python3 harness4genui/ios/capture_ios.py "${{ steps.sim.outputs.udid }}" out "$BID"

      - name: Crash diagnostics
        if: always()
        run: |
          # simctl launch returns a PID and exit 0 even when the app dies immediately after,
          # so a successful launch tells us nothing. Go and read why it died.
          mkdir -p out
          echo "=== recent app log ==="
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show --style compact             --last 5m --predicate 'processImagePath CONTAINS "Wikipedia"' 2>/dev/null             | tail -80 | tee out/app-log.txt || echo "(no log)"
          echo "=== crash reports ==="
          CR=~/Library/Logs/DiagnosticReports
          ls -t "$CR" 2>/dev/null | head -20 || echo "(none)"
          for f in $(ls -t "$CR"/*.ips 2>/dev/null | head -3); do
            echo "--- $f"
            head -60 "$f" | tee -a out/crash.txt
          done

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-surface
          path: out/

# .github/workflows/ios-surface.yml
name: ios-surface

on:
  workflow_dispatch:
    inputs:
      device:
        description: Simulator device name
        default: "iPhone 16"

jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Check out Wikipedia iOS
        uses: actions/checkout@v4
        with:
          repository: wikimedia/wikipedia-ios
          path: wikipedia-ios

      - name: Select the newest Xcode
        run: |
          # The runner defaults to Xcode 16.4, but wikipedia-ios main uses iOS 26 "Liquid
          # Glass" APIs (glassEffect, .glassProminent, UIButton.Configuration.glass), which
          # 16.4 cannot compile. Pick the highest Xcode 26 present.
          NEWEST=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          echo "selecting $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version

      - name: Environment
        run: |
          xcodebuild -version
          echo "--- available Xcodes ---"
          ls /Applications | grep -i '^Xcode' || true
          xcrun simctl list runtimes

      - name: Generate the open-source build configuration
        working-directory: wikipedia-ios
        run: |
          # wikipedia-ios does not commit Configurations/OpenSourceDebug.xcconfig; it is
          # generated. Without this the build fails with "Unable to open base configuration
          # reference file". The "ci" argument writes the file with the default team id and
          # skips the interactive team-selection prompt.
          scripts/setup_bundle_id ci
          cat Configurations/OpenSourceDebug.xcconfig

      - name: List schemes
        working-directory: wikipedia-ios
        run: xcodebuild -list -project Wikipedia.xcodeproj

      - name: Boot simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 -E "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b || true

      - name: Build for simulator
        working-directory: wikipedia-ios
        run: |
          # Capture the FULL log to a file and surface only compiler diagnostics.
          # An earlier run piped to `tail`, which discarded the one line that mattered.
          set +e
          xcodebuild -project Wikipedia.xcodeproj -scheme Wikipedia -configuration Debug             -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath ../dd             CODE_SIGNING_ALLOWED=NO build > ../build.log 2>&1
          RC=$?
          echo "xcodebuild exit=$RC"
          echo "============ compiler diagnostics ============"
          grep -E "(error|warning): " ../build.log | sort -u | head -60 || true
          echo "============ last 40 lines ==================="
          tail -40 ../build.log
          exit $RC

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Install and launch
        run: |
          APP=$(find dd/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "app bundle: $APP"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "bundle id: $BID"
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" "$BID"
          sleep 25

      - name: Install idb
        run: |
          brew tap facebook/fb
          brew install idb-companion
          python3 -m pip install --break-system-packages --upgrade fb-idb

      - name: Capture accessibility trees
        run: python3 harness4genui/ios/capture_ios.py "${{ steps.sim.outputs.udid }}" out

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-surface
          path: out/
